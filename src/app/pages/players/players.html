<section>
  <h1>Manchester United Players</h1>
  <input
    type="text"
    placeholder="Search Players..."
    (input)="searchTerm.set($any($event.target).value)"
  />

  @if (isLoading()) {
    <p>Loading players...</p>
  } @else {
    @for (player of filteredPlayers(); track player.id) {
      <app-player-card
        [player]="player"
        (profileClicked)="openProfile($event)"
      />
    }
  }
</section>
