<button (click)="goBack()">
  Back to Players
</button>

@if (player) {
  <section>
<h1>{{ player.name }}</h1>

<p>
  Position: {{ player.position }}
</p>

<p>
  Squad Number: {{ player.number }}
</p>

<p>
  Nationality: {{ player.nationality }}
</p>

<p>
  Appearances: {{ player.appearances }}
</p>

<p>
  Goals: {{ player.goals }}
</p>
  </section>

}
