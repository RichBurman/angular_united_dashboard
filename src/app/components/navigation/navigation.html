<nav aria-label="Primary navigation">
  <ul>
    @for (item of navigationItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/home' }"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
