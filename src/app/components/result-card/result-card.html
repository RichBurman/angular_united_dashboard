<div class="result-card">

  <p>{{ match().competition }}</p>

  <div class="teams">

    <span>{{ match().homeTeam }}</span>

    <strong>
      {{ match().homeScore }} - {{ match().awayScore }}
    </strong>

    <span>{{ match().awayTeam }}</span>

  </div>

  <p>{{ match().date | date: 'dd MMMM yyyy' }}</p>

</div>
